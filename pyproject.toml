[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "possession"
version = "0.1.0"
description = "Frame-level football possession labeling (More than a Hack 2027)"
requires-python = ">=3.13"
# Runtime dependencies are pinned in requirements.txt, not here, so that
# `pip install -e . --no-deps` never resolves anything new.
dependencies = []

[tool.setuptools]
packages = ["possession"]
